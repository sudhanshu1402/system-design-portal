<rect width="1200" height="500" fill="#f3efe6"/><rect x="22" y="22" width="1156" height="456" fill="none" stroke="#141414" stroke-width="2"/>
<text x="52" y="62" class="sa" font-size="12" letter-spacing="3" fill="#141414">SYSTEM DESIGN PORTAL · FIVE ARCHITECTURE WRITE-UPS</text><text x="1148" y="62" text-anchor="end" class="sa" font-size="12" letter-spacing="3" fill="#141414">NEXT.JS · NEXTRA · GITHUB PAGES</text>
<line x1="52" x2="1148" y1="76" y2="76" stroke="#141414"/>
<text x="600" y="160" text-anchor="middle" class="se" font-size="80" font-weight="700" fill="#141414">The Design Review</text>
<text x="600" y="198" text-anchor="middle" class="se" font-size="19" font-style="italic" fill="#4a4a4a">the problem, the decisions I'd defend, and where each design stops working</text>
<line x1="52" x2="1148" y1="226" y2="226" stroke="#141414" stroke-width="3"/><line x1="52" x2="1148" y1="232" y2="232" stroke="#141414"/>
<text x="52" y="264" class="sa" font-size="12" letter-spacing="3" fill="#141414">IN THIS ISSUE</text><g class="in" style="animation-delay:0.4s"><text x="60" y="300" class="se" font-size="14" fill="#ff4d2e" letter-spacing="2">I</text><text x="100" y="300" class="se" font-size="20" font-weight="700" fill="#141414">The Enterprise Auth Gateway</text><text x="100" y="322" class="se" font-size="15" font-style="italic" fill="#555">on a rotated cert that outlives its cache</text></g><g class="in" style="animation-delay:0.6000000000000001s"><text x="60" y="350" class="se" font-size="14" fill="#ff4d2e" letter-spacing="2">II</text><text x="100" y="350" class="se" font-size="20" font-weight="700" fill="#141414">The Distributed Queue Engine</text><text x="100" y="372" class="se" font-size="15" font-style="italic" fill="#555">on a 2 second dependency on the request path</text></g><g class="in" style="animation-delay:0.8s"><text x="60" y="400" class="se" font-size="14" fill="#ff4d2e" letter-spacing="2">III</text><text x="100" y="400" class="se" font-size="20" font-weight="700" fill="#141414">Multi-Region Sharding</text><text x="100" y="422" class="se" font-size="15" font-style="italic" fill="#555">on EU data that must stay in the EU</text></g><g class="in" style="animation-delay:1.0s"><text x="620" y="300" class="se" font-size="14" fill="#ff4d2e" letter-spacing="2">IV</text><text x="660" y="300" class="se" font-size="20" font-weight="700" fill="#141414">LLM Orchestration</text><text x="660" y="322" class="se" font-size="15" font-style="italic" fill="#555">on almost-valid model output</text></g><g class="in" style="animation-delay:1.2000000000000002s"><text x="620" y="350" class="se" font-size="14" fill="#ff4d2e" letter-spacing="2">V</text><text x="660" y="350" class="se" font-size="20" font-weight="700" fill="#141414">Distributed Observability</text><text x="660" y="372" class="se" font-size="15" font-style="italic" fill="#555">on a log line with no trace</text></g></svg>